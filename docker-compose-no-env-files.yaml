# basta trocar os `env_file:` por `env:` com o conteúdo dos arquivos
# docker-compose -f docker-compose-no-env-files.yaml up
name: MicroserviceECommerce

services:

# Frontends
  front-cliente:
    image: jp9910/microsservico-front-cliente:main
    container_name: front-cliente
    ports:
      - "5173:80" # caso o api gateway seja configurado a tempo, apenas a porta 80 dele precisaria ser bindada com o host, e as portas dos containers dos microsserviços não precisariam, bastando ser expostas (em vez de bindadas).
    depends_on:
      - gateway
    networks:
      - front

  front-administracao:
    image: jp9910/microsservico-front-administracao:main
    container_name: front-adm
    ports:
      - "4200:80"
    depends_on:
      - gateway
    networks:
      - front

# API Gateway
  gateway:
    image: nginx:alpine
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./api-gateway/proxy.conf:/etc/nginx/conf.d/proxy.conf
      - ./api-gateway/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    depends_on:
      - api-loja
      - api-autenticacao
      - api-carrinho
    networks:
      - front
      - back
      - monit


# APIs
  api-loja: # Pegar a imagem do Docker Hub, que deve ser automaticamente atualizada a cada push no repo da loja
    image: jp9910/microsservico-loja:main # <docker_hub_user>/<nome_da_imagem_upada>:<branch>
    ports:
      - "8079:8079"
      - "8080:8080"
    environment:
    # No formato de lista, aspas nas envs seriam consideradas parte da variavel
    # No formato com :, não
      DBConnectionString: "Host=postgres-loja;Database=loja;Username=postgres;Password=senha"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    command: sh ./entrypoint-loja.sh
    volumes:
      - ./:/src
    depends_on:
      rabbitmq:
        condition: service_started
      postgres-loja:
        condition: service_healthy
    networks:
      - front
      - back

  api-autenticacao:
    image: jp9910/microsservico-autenticacao:main
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-autenticacao:5432/autenticacao"
      SPRING_ACTIVE_PROFILE: dev
      URL_LOKI: http://loki-auth:3100
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: senha
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_started
      postgres-autenticacao:
        condition: service_healthy
    networks:
      - front
      - back
      - monit

  api-carrinho:
    image: jp9910/microsservico-carrinho:main
    command: >
      "npm install &&
      npm run dev" 
    environment:
      db_location: local
      local_db_username: carrinho-usuario
      local_db_password: carrinho-senha
      local_db_container_name: mongo-carrinho
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - 3000:3000
    depends_on:
      - mongo-carrinho
      - rabbitmq
    networks:
      - front
      - back

# BANCOS DE DADOS

  memcached:
    image: memcached:1.6
    ports:
      - "11211:11211"
    command:
      - --conn-limit=1024
      - --memory-limit=64
      - --threads=4

  mongo-carrinho:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: carrinho-usuario
      MONGO_INITDB_ROOT_PASSWORD: carrinho-senha
      MONGO_INITDB_DATABASE: microsservico-carrinho
    networks:
      - back

  postgres-loja:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgresloja-data:/var/lib/postgresql/data
    user: postgres
    environment:
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: "loja"
      POSTGRES_USER: "postgres"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back

  postgres-autenticacao:
    image: postgres:17
    ports:
      - "5433:5432"
    volumes:
      - postgresauth-data:/var/lib/postgresql/data
    user: postgres
    environment:
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: "autenticacao"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back

# SERVIÇO DE MENSAGERIA
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
    # !! não colocar aspas nas envs em formato de lista !!
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - 5672:5672
      - 15672:15672 # interface de gerenciamento
    networks:
      - back

# SERVIÇOS DE MONITORAMENTO
  prometheus-auth:
    image: prom/prometheus:latest
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      # Arquivo de configuração do prometheus
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Onde vai ser armazenado a TimeSeriesDatabase
      - '--storage.tsdb.path=/prometheus'
      # Bibliotecas que serão utilizadas pelo prometheus
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      # Bibliotecas que serão utilizadas pelo prometheus
      - '--web.console.templates=/etc/prometheus/consoles'
      # Habilitar lifecycle pro armazenamento do prometheus
      - '--web.enable-lifecycle'
    ports:
      - 9090:9090
    depends_on:
      - api-autenticacao # por enquanto só está sendo usado para o microsserviço de autenticação
    user: root
    networks:
      - monit

  grafana-auth:
    image: grafana/grafana # https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - 9091:3000
    depends_on:
      - prometheus-auth
    networks:
      - monit

  loki-auth:
    image: grafana/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-print-config-stderr=true"
    ports:
      - "9092:3100"
    networks:
      - monit

# Simulação de um consumidor do microsserviço de autenticação, pra poderem ser vistos alguns dados no grafana
  simulacao-consumidor:
    build:
      context: ./simulacao_consumidor_api/
      dockerfile: Dockerfile
    image: simulacao-consumidor
    depends_on:
      - api-autenticacao
      - grafana-auth
    networks:
      - back

# INTERFACE DE GERENCIAMENTO DO POSTGRESQL
  # pgadmin:
  #   image: dpage/pgadmin4
  #   ports:
  #     - "8082:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: jops40@hotmail.com
  #     PGADMIN_DEFAULT_PASSWORD: senha
  #   depends_on:
  #     - postgres-autenticacao


volumes:
  postgresauth-data:
  postgresloja-data:
  grafana-data:
  prometheus-data:

networks:
  front:
    driver: bridge
  back:
    driver: bridge
  monit:
    driver: bridge