apiVersion: v1
kind: Service
metadata:
  name: svc-postgres-autenticacao
  labels:
    app: postgres-autenticacao
spec:
  clusterIP: None # Other services can directly discover and communicate with individual Pods. Melhor para statefulsets, comumente DBs
  # type: ClusterIP
  ports:
  - port: 5432
    name: port-postgres-autenticacao
  selector:
    app: postgres-autenticacao
---

apiVersion: v1
kind: Service
metadata:
  name: api-autenticacao # !! esse deve ser o nome que o nginx api-gateway está configurado para redirecionar para !!
  labels:
    app: ms-autenticacao
spec:
  type: ClusterIP # Acessível apenas dentro do cluster
  ports:
  - port: 8081 # The port other deployments will use to connect (!!deve ser a porta para onde o api-gateway vai redirecionar!!)
    targetPort: 8081 # The container port inside the Pods
  selector:
    app: ms-autenticacao
---

apiVersion: v1
kind: Service
metadata:
  name: gateway # !! esse deve ser o nome que o nginx do frontend está configurado para redirecionar para !!
  labels:
    app: api-gateway
spec:
  type: ClusterIP # Acessível apenas dentro do cluster
  ports:
  - port: 80 # The port other deployments will use to connect (!!deve ser a porta para onde o api-gateway vai redirecionar!!)
    targetPort: 80 # The container port inside the Pods
  selector:
    app: api-gateway
---

apiVersion: v1
kind: Service
metadata:
  name: svc-ms-front-cliente
  labels:
    app: ms-front-cliente
spec:
  type: LoadBalancer
  ports:
  - port: 5173 # é a partir daqui que o cliente vai acessar
    targetPort: 80
  selector:
    app: ms-front-cliente
---

apiVersion: v1
kind: Service
metadata:
  name: api-loja # !! esse deve ser o nome que o nginx api-gateway está configurado para redirecionar para !!
  labels:
    app: ms-loja
spec:
  type: ClusterIP # Acessível apenas dentro do cluster
  ports:
  - port: 8080 # The port other deployments will use to connect (!!deve ser a porta para onde o api-gateway vai redirecionar!!)
    targetPort: 8080 # The container port inside the Pods
  selector:
    app: ms-loja
---

apiVersion: v1
kind: Service
metadata:
  name: svc-postgres-loja
  labels:
    app: postgres-loja
spec:
  clusterIP: None # Other services can directly discover and communicate with individual Pods. Melhor para statefulsets, comumente DBs
  # type: ClusterIP
  ports:
  - port: 5432
    name: port-postgres-loja
  selector:
    app: postgres-loja
---

