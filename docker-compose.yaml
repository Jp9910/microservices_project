name: MicroserviceECommerce

services:

# Frontends
  front-cliente:
    image: jp9910/microsservico-front-cliente:main
    container_name: front-cliente
    ports:
      - "5173:80" # caso o api gateway seja configurado a tempo, apenas a porta 80 dele precisaria ser bindada com o host, e as portas dos containers dos microsserviços não precisariam, bastando ser expostas (em vez de bindadas).
    depends_on:
      - gateway
    networks:
      - front

  front-administracao:
    image: jp9910/microsservico-front-administracao:main
    container_name: front-adm
    ports:
      - "4200:80"
    depends_on:
      - gateway
    networks:
      - front

# API Gateway
  gateway:
    image: nginx:alpine
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./api-gateway/proxy.conf:/etc/nginx/conf.d/proxy.conf
      - ./api-gateway/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    depends_on:
      - api-loja
      - api-autenticacao
      - api-carrinho
    networks:
      - front
      - back
      - monit

# APIs
  api-loja: # Pegar a imagem do Docker Hub, que deve ser automaticamente atualizada a cada push no repo da loja
    image: jp9910/microsservico-loja:main # <docker_hub_user>/<nome_da_imagem_upada>:<branch>
    ports:
      - "8079:8079"
      - "8080:8080"
    env_file: ".env.api-loja"
    command: sh ./entrypoint-loja.sh
    volumes:
      - ./:/src
    depends_on:
      rabbitmq:
        condition: service_started
      postgres-loja:
        condition: service_healthy
    networks:
      - back

  api-autenticacao:
    image: jp9910/microsservico-autenticacao:main
    env_file:
      - .env.api-autenticacao
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-autenticacao:5432/autenticacao"
      SPRING_ACTIVE_PROFILE: dev
      URL_LOKI: http://loki-auth:3100
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_started
      postgres-autenticacao:
        condition: service_healthy
    networks:
      - back
      - monit

  api-carrinho:
    image: jp9910/microsservico-carrinho:main
    command: >
      "npm install &&
      npm run dev" 
    env_file: ".env.api-carrinho"
    ports:
      - 3000:3000
    depends_on:
      - mongo-carrinho
      - rabbitmq
    networks:
      - back

# BANCOS DE DADOS
  mongo-carrinho:
    image: mongo
    env_file: ".mongo-container.env"
    networks:
      - back

  postgres-loja:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgresloja-data:/var/lib/postgresql/data
    secrets:
      - senha-postgres-loja
    user: postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/senha-postgres-loja
      POSTGRES_DB: "loja"
      POSTGRES_USER: "postgres"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back

  postgres-autenticacao:
    image: postgres:17
    ports:
      - "5433:5432"
    volumes:
      - postgresauth-data:/var/lib/postgresql/data
    secrets:
      - senha-postgres-auth
    user: postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/senha-postgres-auth
      POSTGRES_DB: "autenticacao"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back

# SERVIÇO DE MENSAGERIA
  rabbitmq:
    image: rabbitmq:3.13-management
    env_file: ".rabbitmq-container.env"
    ports:
      - 5672:5672
      - 15672:15672 # interface de gerenciamento
    networks:
      - back

# SERVIÇOS DE MONITORAMENTO
  prometheus-auth:
    image: prom/prometheus:latest
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      # Arquivo de configuração do prometheus
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Onde vai ser armazenado a TimeSeriesDatabase
      - '--storage.tsdb.path=/prometheus'
      # Bibliotecas que serão utilizadas pelo prometheus
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      # Bibliotecas que serão utilizadas pelo prometheus
      - '--web.console.templates=/etc/prometheus/consoles'
      # Habilitar lifecycle pro armazenamento do prometheus
      - '--web.enable-lifecycle'
    ports:
      - 9090:9090
    depends_on:
      - api-autenticacao # por enquanto só está sendo usado para o microsserviço de autenticação
    user: root
    networks:
      - monit

  grafana-auth:
    image: grafana/grafana # https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - 9091:3000
    depends_on:
      - prometheus-auth
    networks:
      - monit

  loki-auth:
    image: grafana/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-print-config-stderr=true"
    ports:
      - "9092:3100"
    networks:
      - monit

# Simulação de um consumidor do microsserviço de autenticação, pra poderem ser vistos alguns dados no grafana
  # simulacao-consumidor:
  #   build:
  #     context: ./simulacao_consumidor_api/
  #     dockerfile: Dockerfile
  #   image: simulacao-consumidor
  #   depends_on:
  #     - api-autenticacao
