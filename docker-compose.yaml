volumes:
  postgresauth-data:
  postgresloja-data:
  grafana-data:
  prometheus-data:

secrets:
  senha-postgres-auth:
    file: ./.senhapostgresauth.env
  senha-postgres-loja:
    file: ./.senhapostgresloja.env

networks:
  front:
    driver: bridge
  back:
    driver: bridge
  monit:
    driver: bridge